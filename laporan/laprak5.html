<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Belum Tersedia</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="../bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../custom.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(232, 62, 140, 0.12), transparent 35%),
                radial-gradient(circle at bottom left, rgba(255, 111, 183, 0.08), transparent 35%),
                var(--bg);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            color: var(--text);
        }

        .placeholder-card {
            width: 100%;
            max-width: 760px;
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 55px 45px;
            text-align: center;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(232, 62, 140, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .coming-soon {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 999px;
            background: rgba(232, 62, 140, 0.1);
            border: 1px solid rgba(232, 62, 140, 0.25);
            color: var(--accent-2);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .04em;
            margin-bottom: 24px;
        }

        .placeholder-icon {
            width: 105px;
            height: 105px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: linear-gradient(135deg,
                    rgba(232, 62, 140, 0.2),
                    rgba(255, 111, 183, 0.12));
            border: 1px solid rgba(232, 62, 140, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: var(--accent);
            box-shadow:
                0 8px 25px rgba(232, 62, 140, 0.2),
                0 0 40px rgba(232, 62, 140, 0.08);
        }

        .placeholder-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 2.6rem);
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text);
        }

        .placeholder-card h1 span {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .placeholder-card p {
            max-width: 560px;
            margin: 0 auto 34px;
            color: var(--muted);
            line-height: 1.9;
            font-size: 15px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 24px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: .25s ease;
            box-shadow: 0 6px 20px rgba(232, 62, 140, 0.35);
        }

        .btn-home:hover {
            transform: translateY(-3px);
            color: #fff;
            box-shadow: 0 12px 30px rgba(232, 62, 140, 0.5);
        }

        @media (max-width: 600px) {
            .placeholder-card {
                padding: 42px 24px;
            }

            .placeholder-card h1 {
                font-size: 1.9rem;
            }

            .placeholder-card p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="placeholder-card">

        <div class="coming-soon">
            <i class="fa-solid fa-clock"></i>
            Coming Soon
        </div>

        <div class="placeholder-icon">
            <i class="fa-solid fa-file-circle-xmark"></i>
        </div>

        <h1>Laporan Praktikum <span>Belum Tersedia</span></h1>

        <p>
            Halaman laporan praktikum ini masih dalam tahap pengembangan dan penyesuaian isi.
            Dokumentasi, pembahasan, serta screenshot praktikum akan segera ditambahkan
            sesuai materi pertemuan.
        </p>

        <a href="main.html" class="btn-home">
            <i class="fa-solid fa-arrow-left"></i>
            Kembali ke Daftar Laporan
        </a>

    </div>

</body>

</html>
